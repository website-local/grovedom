name: Build and verify

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            os: ubuntu-22.04
            llvm: 15
          - target: wasm
            os: ubuntu-24.04
            llvm: 19
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CC: clang-${{ matrix.llvm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set runner paths
        run: node scripts/ci/runner-paths.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Provision compiler on the hosted runner
        env:
          LLVM_VERSION: ${{ matrix.llvm }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" cmake ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - name: Fetch verified build inputs
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/ci/prepare-build.mjs "$BUILD_TARGET"
      - name: Build release binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: npm run "build:$BUILD_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/grovedom/${{ matrix.target }}/grovedom.*
            ${{ runner.temp }}/grovedom/${{ matrix.target }}/build.json
            ${{ runner.temp }}/grovedom/${{ matrix.target }}/build-config.js
          if-no-files-found: error
          retention-days: 7

  test:
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: [build, packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, node: '22.0.0', scope: linux, install: both }
          - { os: ubuntu-22.04, node: '22', scope: all-heaps, install: none }
          - { os: ubuntu-22.04, node: '24', scope: linux, install: both }
          - { os: macos-14, node: '24', scope: portable, install: wasm }
          - { os: windows-2022, node: '24', scope: portable, install: wasm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set runner paths
        run: node scripts/ci/runner-paths.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-wasm
          path: ${{ env.GROVEDOM_WASM_BUILD_DIR }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'Linux'
        with:
          name: build-native
          path: ${{ env.GROVEDOM_BUILD_DIR }}
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Run every configuration in a separate process
        env:
          TEST_SCOPE: ${{ matrix.scope }}
        run: npm run ci:test -- "$TEST_SCOPE" none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: tarballs
        if: ${{ !cancelled() && needs.packages.result == 'success' && matrix.install != 'none' }}
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Install and exercise packed artifacts without Cheerio
        if: ${{ !cancelled() && steps.tarballs.outcome == 'success' }}
        env:
          PACKAGE_TARGET: ${{ matrix.install }}
        run: npm run ci:install -- "$RUNNER_TEMP/tarballs" "$PACKAGE_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ env.GROVEDOM_FUZZ_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  sanitize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CC: clang-15
      GROVEDOM_SANITIZE: '1'
      GROVEDOM_BACKEND: napi
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set runner paths
        run: node scripts/ci/runner-paths.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 llvm-15 cmake ninja-build
          echo /usr/lib/llvm-15/bin >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: node scripts/ci/prepare-build.mjs native
      - id: sanitized-build
        run: npm run build:native
      - name: ASan and UBSan with leak detection
        run: LD_PRELOAD="$(clang-15 --print-file-name=libclang_rt.asan-x86_64.so)" node --test --test-concurrency=1 test/*.test.mjs
      - name: Owned-buffer allocation failure checks
        if: ${{ !cancelled() && steps.sanitized-build.outcome == 'success' }}
        run: node scripts/check-faults.mjs

  packages:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set runner paths
        run: node scripts/ci/runner-paths.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-wasm
          path: ${{ env.GROVEDOM_WASM_BUILD_DIR }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-native
          path: ${{ env.GROVEDOM_BUILD_DIR }}
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run ci:pack -- "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/release/tarballs/
          if-no-files-found: error
          retention-days: 7

  gate:
    if: always()
    needs: [build, test, sanitize, packages]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const job of Object.values(JSON.parse(process.env.RESULTS))) if (job.result !== "success") process.exit(1)'
